[project]
name = "drivelyrics-homeassistant"
version = "0.1.0"
description = "Home Assistant integration for DriveLyrics' now-playing feed"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = ["D203", "D213", "D205", "D401", "PLR0913", "PLR2004", "E501", "RUF001", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0915", "S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
